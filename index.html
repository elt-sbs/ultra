<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stash Scraper Index</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; color: #24292e; }
    .scraper-card { border: 1px solid #e1e4e8; border-radius: 6px; padding: 16px; margin-bottom: 16px; background: #fff; }
    .scraper-title { margin: 0 0 8px 0; display: flex; align-items: center; justify-content: space-between; }
    .badge { background: #0366d6; color: white; padding: 2px 8px; border-radius: 12px; font-size: 0.8rem; }
    .meta { font-size: 0.85rem; color: #586069; margin-bottom: 8px; }
    code { background: #f6f8fa; padding: 2px 6px; border-radius: 3px; font-family: monospace; }
  </style>
</head>
<body>
  <h1>Scraper Repository</h1>
  <p>Copy this URL into Stash under <strong>Settings > Metadata Providers</strong>:</p>
  <p><code id="feed-url">Loading...</code></p>

  <h2>Available Scrapers</h2>
  <div id="scraper-list">Loading scrapers...</div>

  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script src="scraperlist.js"></script>
</body>
</html>
